<template>

    <lightning-datatable
        key-field="id"
         data={contactData}
         columns={columns}
         onrowaction={handleRowAction}
         wrap-text-max-lines = "5"
    >
    </lightning-datatable>

    <template if:true={showEdit}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- modal header start -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Welcome in Apex Hours</h2>
                </header>
            
                <!-- modal body start -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <p>Modal/Popup in Lightning Web Component (LWC) Demo</p>
                        <lightning-record-edit-form object-api-name={objApiName} record-id={recId} onsubmit={updateRecord}>
                            <lightning-input-field field-name="Name" ></lightning-input-field>
                            <lightning-input-field field-name="Email" value="abc@xyz.xom"></lightning-input-field>

                            <lightning-button label="Update" type="submit" ></lightning-button>
                        </lightning-record-edit-form>
                </div>

                <!-- modal footer start-->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                </footer>
            
            </div>
        </section>
    </template>
</template>
