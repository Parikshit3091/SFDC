<template>
    <lightning-card title="Sales Lead Form" icon-name="standard:lead">
        <template lwc:if={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>
        <template if:false={isLoading}>
            <div class="slds-p-around_medium">
                <template lwc:if={section1}>
                    <c-custom-lookup
                    label="Account"
                    placeholder="Search Account..."
                    object-api-name="Account"
                    value={accountId}
                    required
                    onrecordchange={handleAccountChange}
                ></c-custom-lookup>
                <lightning-input
                    type="text"
                    label="Account Name"
                    value={accName}
                    readonly
                ></lightning-input>
                <lightning-input
                    label="Account Number"
                    type="text"
                    value={accNumber}
                    required  
                ></lightning-input>
                </template>

                <template lwc:if={section2}>
                    <c-custom-lookup
                        label="Contact"
                        placeholder="Search Contact..."
                        object-api-name="Contact"
                        value={contactId}
                        required
                        selected-parent-id={selectedAccountID}
                        onrecordchange={handleContactChange}
                    ></c-custom-lookup>
                    <lightning-input
                        label="Phone"
                        type="tel"
                        value={phone}
                        required
                    ></lightning-input>
                </template>
                <template lwc:if={section3}>
                    <c-custom-lookup
                        label="Opportunity"
                        placeholder="Search Opportunity..."
                        object-api-name="Opportunity"
                        value={opportunityId}
                        required
                        filter={opportunityFilterCriteria}
                        selected-parent-id={selectedAccountID}
                        onchange={handleOpportunityChange}
                    ></c-custom-lookup>
                </template>

                <div class="slds-p-left_medium slds-float_right">
                    <template lwc:if={firstSection} >
                        <lightning-button  variant="brand" label="Next" onclick={handleNext} ></lightning-button>
                    </template>
                    <template lwc:if={middleSection} >
                        <lightning-button variant="brand" label="Back" onclick={handleBack} ></lightning-button>
                        <lightning-button  variant="brand" label="Next" onclick={handleNext} ></lightning-button>
                    </template>
                    <template lwc:if={lastSection} >
                        <lightning-button variant="brand" label="Back" onclick={handleBack} ></lightning-button>
                        <lightning-button variant="brand" label="Submit" onclick={handleSubmit} ></lightning-button>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
